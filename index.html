<!doctype html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./output.css" rel="stylesheet">
</head>
<body>
    <h1 class="bg-blue-500 text-3xl text-white font-bold text-center underline p-4 border rounded">
    Hello world!
    </h1>

    <table class="border-collapse table-auto w-full text-sm">
        <thead>
          <tr>
            <th class="border p-4 italic">This is a nice table</th>
          </tr>
        </thead>
        <tbody>
          <tr class="hover:bg-grey-lighter">
            <td class="border border-red-500 border-2 p-4 bg-yellow-400">Look at this row</td>
        </tr>
        <tr class="hover:bg-grey-lighter">
            <td class="border border-yellow-500 border-1 p-4 bg-green-400 text-blue-800 underline">Now look at this row</td>
        </tr>
        <tr class="hover:bg-grey-lighter">
            <td class="border border-blue-500 border-5 p-4 bg-red-500 text-yellow-300 font-bold">Isn't Tailwind cool?!</td>
        </tr>
        </tbody>
      </table>
</body>
</html>
